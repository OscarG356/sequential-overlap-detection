# Configuración global del proyecto
data:
  root: "../data/raw/raw_data"
  scenarios: ["32G_B2B"]
  rs_gbaud: 32.0
  rolloff: 0.1
  # B_nom = 32 * 1.1 = 35.2 GHz
  boundary_ghz: 35.2
  ambiguous_dirs: []
  control_dirs: []
  ignore_files: []

blocks:
  size: 100          # m símbolos por bloque
  disjoint: true

split:
  strategy: "by_song"
  train_songs: ["song1", "song2"]
  val_songs: ["song3"]
  test_songs: ["song4"]

kde:
  subsample: 3000
  bandwidth: 0.05   # h absoluto para sklearn
  seed: 0
